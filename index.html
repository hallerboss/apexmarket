<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    function Counter() {
      const [count, setCount] = useState(0);
      return (
        <div className="flex flex-col items-center justify-center min-h-screen gap-6">
          <h1 className="text-5xl font-bold">React Counter</h1>
          <p className="text-6xl font-mono text-cyan-400">{count}</p>
          <div className="flex gap-3">
            <button onClick={() => setCount(c => c - 1)} className="px-5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700">-</button>
            <button onClick={() => setCount(0)} className="px-5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700">Reset</button>
            <button onClick={() => setCount(c => c + 1)} className="px-5 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500">+</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Counter />);
  </script>
</body>
</html>
